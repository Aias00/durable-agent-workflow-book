<svg xmlns="http://www.w3.org/2000/svg" width="480" height="720" viewBox="0 0 480 720" role="img" aria-labelledby="title desc"><title id="title">三个提交点之间的故障窗口</title><desc id="desc">领取事务提交后可以在工具调用前崩溃；工具事务提交后可能丢失响应；工作流终态与事件最后在另一事务中提交。恢复必须按原业务身份查询。</desc><rect width="480" height="720" rx="16" fill="#f7f7f3"/><g font-family="PingFang SC,Noto Sans CJK SC,sans-serif" fill="#292e34" font-size="24"><text x="24" y="40" font-weight="600">三个提交点，两段故障窗口</text><path d="M240 128V633" stroke="#497fa3" stroke-width="4"/><g fill="#e1eaf2"><rect x="40" y="68" width="400" height="78" rx="10"/><rect x="40" y="295" width="400" height="78" rx="10"/><rect x="40" y="565" width="400" height="90" rx="10"/></g><text x="65" y="100">领取事务提交</text><text x="65" y="130" font-size="21">owner / fence / lease 已保存</text><rect x="45" y="176" width="390" height="74" rx="10" fill="#eee6d7"/><text x="65" y="207">进程可能在工具调用前消失</text><text x="65" y="236" font-size="21">租约到期后进入 unknown</text><text x="65" y="327">独立工具事务提交效果</text><text x="65" y="357" font-size="21">本地工作流此时仍可能运行中</text><rect x="45" y="410" width="390" height="105" rx="10" fill="#e5e1f0"/><text x="65" y="444">响应可能丢失，进程可能退出</text><text x="65" y="478" font-size="21">按原操作键核查工具账本</text><text x="65" y="598">终态与事件共同提交</text><text x="65" y="632" font-size="21">匹配回执 / 当前围栏 / 条件更新</text><text x="24" y="695" font-size="19" fill="#626b74">本地回滚不会撤销已提交的独立工具效果。</text></g></svg>
